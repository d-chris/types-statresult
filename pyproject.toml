[build-system]
build-backend = "poetry.core.masonry.api"
requires = [ "poetry-core" ]

[tool.poetry]
name = "types-statresult"
version = "0.1.1"
description = "creates type stubs for os.stat_result"
license = "MIT"
authors = [ "Christoph Dörrer <d-chris@web.de>" ]
readme = "README.md"
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies.python = "^3.10"
dependencies.astor = ">=0.8.1"
dependencies.black = ">=25.9.0"
dependencies.mypy = ">=1.18.2"
group.test.dependencies.pytest = "^8.4.2"
group.test.dependencies.pytest-cov = "^7.0.0"
group.test.dependencies.pytest-mock = "^3.15.1"
group.test.dependencies.pytest-randomly = "^4.0.1"
urls.repository = "https://github.com/d-chris/types-statresult"

[tool.pytest]
ini_options.minversion = "6.0"
ini_options.testpaths = "tests"
ini_options.addopts = [
  "--color=yes",
  "-s",
  "--cov=types_statresult",
  "--cov-report=term-missing",
]

[tool.coverage]
run.omit = [ "tests/*" ]
report.exclude_lines = [
  "^def normalize_url",
]
